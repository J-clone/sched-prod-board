<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="build" content="__BUILD_SHA__" />
    <title>sched-prod · incidents</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header>
      <h1>incidents</h1>
      <p class="sub">sched-prod · tonight</p>
    </header>
    <main data-testid="board">
      <p data-testid="loader" class="loader" role="status" aria-live="polite">Loading incidents…</p>
      <p data-testid="empty" class="empty" hidden>No incidents tonight.</p>
      <p class="error" data-kind="load" role="alert" hidden></p>
      <ul data-testid="incident-list" class="list"></ul>
      <aside id="incident-panel" data-testid="incident-panel" class="panel" hidden aria-labelledby="panel-title">
        <div class="panel-head">
          <h2 id="panel-title" class="panel-title" tabindex="-1"></h2>
          <button type="button" class="panel-close" aria-label="Close panel">×</button>
        </div>
        <dl class="panel-fields"></dl>
        <button type="button" data-testid="panel-ack" class="ack panel-ack">Ack</button>
        <p class="panel-acked" hidden></p>
        <p class="panel-error error" role="alert" hidden></p>
      </aside>
    </main>
    <footer>sched-prod incident board · build <code data-testid="build-sha">__BUILD_SHA__</code></footer>
  </body>
</html>
